# training_config.yaml - Hyperparameters and paths for CIFAR-10 training
#
# LOCAL RUN:  data_dir and checkpoint_dir use relative paths (./data, ./checkpoints)
# DOCKER/K8S: override via mounted volume at /app/data and /app/checkpoints
#             (the k8s ConfigMap uses /app/* paths)

model:
  architecture: resnet18   # Options: resnet18, resnet34, resnet50, cnn
  num_classes: 10
  pretrained: true         # Use ImageNet pretrained weights

training:
  epochs: 10
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 3

data:
  dataset: cifar10
  data_dir: ./data          # Relative path for local runs; Docker mounts override this
  num_workers: 2

output:
  checkpoint_dir: ./checkpoints   # Relative path for local runs; Docker mounts override this
  model_name: classifier_v1.pt

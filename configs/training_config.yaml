# training_config.yaml - Hyperparameters and paths for CIFAR-10 training

model:
  architecture: resnet18   # Options: resnet18, resnet34, resnet50, cnn
  num_classes: 10
  pretrained: true         # Use ImageNet pretrained weights

training:
  epochs: 10
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 3

data:
  dataset: cifar10
  data_dir: /app/data
  num_workers: 2

output:
  checkpoint_dir: /app/checkpoints
  model_name: classifier_v1.pt

# =============================================================================
# serving-service.yaml - Kubernetes Service for model serving
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: model-serving
  namespace: ml-training
  labels:
    project: mlops-pytorch-pipeline
    component: serving
spec:
  # Use ClusterIP for internal cluster access.
  # Change to LoadBalancer if using a cloud-managed cluster (GKE, EKS, AKS).
  type: ClusterIP
  selector:
    app: model-serving
  ports:
    - name: http
      protocol: TCP
      port: 80          # Service port (external-facing within cluster)
      targetPort: 8080  # Container port

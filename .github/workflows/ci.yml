name: CI Pipeline

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-cpu-${{ hashFiles('requirements/train.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-cpu-

      - name: Install CPU-only PyTorch (fast CI install)
        run: |
          python -m pip install --upgrade pip
          # Install CPU-only torch to avoid downloading the 2GB CUDA build
          pip install --no-cache-dir \
            torch==2.2.2+cpu \
            torchvision==0.17.2+cpu \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install remaining dependencies
        run: |
          pip install --no-cache-dir \
            PyYAML==6.0.1 \
            numpy==1.26.4 \
            Pillow==10.3.0 \
            tqdm==4.66.4 \
            flake8==7.0.0 \
            pytest==8.2.2 \
            pytest-cov==5.0.0

      - name: Lint with flake8
        run: |
          flake8 src/ tests/ \
            --max-line-length=100 \
            --ignore=E501,W503,E402

      - name: Run tests
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --tb=short

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  validate-yaml:
    name: Validate YAML & K8s Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate YAML syntax with Python
        run: |
          python - <<'EOF'
          import yaml, sys, pathlib, os

          errors = []
          for path in pathlib.Path(".").rglob("*.yaml"):
            # Skip hidden dirs and venv
            parts = path.parts
            if any(p.startswith(".") for p in parts[:-1]):
              continue
            if "venv" in parts or ".venv" in parts:
              continue
            try:
              with open(path) as f:
                content = f.read()
              # Handle multi-document YAML (separated by ---)
              list(yaml.safe_load_all(content))
              print(f"  OK: {path}")
            except yaml.YAMLError as e:
              errors.append(f"  ERROR in {path}: {e}")
              print(f"  ERROR in {path}: {e}")

          if errors:
            print(f"\n{len(errors)} YAML error(s) found.")
            sys.exit(1)
          else:
            print("\nAll YAML files are valid.")
          EOF

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/v1.29.0/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Validate k8s manifests (client-side, no cluster needed)
        run: |
          # --dry-run=client validates manifest structure without a cluster
          kubectl apply --dry-run=client --validate=false -f k8s/namespace.yaml
          kubectl apply --dry-run=client --validate=false -f k8s/configmap.yaml

  build-train-image:
    name: Build Training Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build training image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.train
          push: false
          tags: mlops-train:v1
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-serve-image:
    name: Build Serving Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build serving image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.serve
          push: false
          tags: mlops-serve:v1
          cache-from: type=gha
          cache-to: type=gha,mode=max
